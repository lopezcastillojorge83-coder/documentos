<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" font-family="Segoe UI, Arial, sans-serif">
  <!-- ===================== FONDO ===================== -->
  <rect x="0" y="0" width="1000" height="1250" fill="#f7f9fc"/>

  <!-- ===================== TÍTULO ===================== -->
  <text x="500" y="45" text-anchor="middle" font-size="30" font-weight="bold" fill="#1a2b4a">Prototipo: Carro por Contrapeso</text>
  <text x="500" y="75" text-anchor="middle" font-size="17" fill="#5a6b85">Conversión de energía potencial en movimiento (Física I)</text>
  <line x1="150" y1="90" x2="850" y2="90" stroke="#c7d2e0" stroke-width="2"/>

  <!-- =====================================================================
                        VISTA LATERAL
       ===================================================================== -->
  <text x="60" y="130" font-size="22" font-weight="bold" fill="#1a2b4a">Vista lateral</text>

  <!-- Suelo / mesa -->
  <rect x="60" y="430" width="620" height="18" fill="#8d6e4f"/>
  <rect x="60" y="448" width="620" height="8" fill="#6f543a"/>
  <text x="370" y="475" text-anchor="middle" font-size="14" fill="#6f543a">Superficie horizontal y plana (mesa)</text>
  <!-- borde de la mesa -->
  <rect x="672" y="430" width="8" height="300" fill="#6f543a"/>

  <!-- Chasis -->
  <rect x="150" y="340" width="420" height="40" rx="6" fill="#d9b382" stroke="#a9834f" stroke-width="2"/>
  <text x="360" y="365" text-anchor="middle" font-size="15" font-weight="bold" fill="#5a4326">CHASIS (madera / cartón prensado)</text>

  <!-- Lastre encima del eje trasero -->
  <rect x="190" y="312" width="90" height="28" rx="4" fill="#b0b7c2" stroke="#7d8696" stroke-width="2"/>
  <text x="235" y="331" text-anchor="middle" font-size="12" fill="#333">lastre</text>

  <!-- Rueda trasera (tracción) -->
  <circle cx="230" cy="400" r="62" fill="#e8ecf2" stroke="#4a5568" stroke-width="4"/>
  <circle cx="230" cy="400" r="12" fill="#4a5568"/>
  <circle cx="230" cy="400" r="4" fill="#fff"/>
  <text x="230" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b3a55">Rueda trasera (CD)</text>
  <text x="230" y="522" text-anchor="middle" font-size="12" fill="#5a6b85">FIJA al eje · tracción · radio R</text>

  <!-- Rueda delantera (libre) -->
  <circle cx="500" cy="400" r="62" fill="#e8ecf2" stroke="#4a5568" stroke-width="4"/>
  <circle cx="500" cy="400" r="10" fill="#8d97a8"/>
  <text x="500" y="505" text-anchor="middle" font-size="13" font-weight="bold" fill="#2b3a55">Rueda delantera (CD)</text>
  <text x="500" y="522" text-anchor="middle" font-size="12" fill="#5a6b85">LIBRE · solo apoya</text>

  <!-- Eje tractor (punto donde se enrolla el hilo) -->
  <circle cx="230" cy="400" r="20" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 3"/>
  <text x="300" y="360" font-size="12" fill="#c0392b">eje fino (radio r)</text>
  <line x1="296" y1="366" x2="248" y2="392" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Poste / polea de reenvío arriba del carro -->
  <rect x="300" y="200" width="12" height="140" fill="#9aa4b2"/>
  <circle cx="330" cy="205" r="16" fill="#dfe4ec" stroke="#6b7688" stroke-width="3"/>
  <circle cx="330" cy="205" r="4" fill="#6b7688"/>
  <text x="352" y="195" font-size="12" fill="#5a6b85">polea de reenvío</text>

  <!-- Hilo: del eje sube al poste, pasa por polea y baja al borde de la mesa -->
  <path d="M 230 380 L 230 300 L 306 210" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M 345 205 L 676 205 L 676 600" fill="none" stroke="#333" stroke-width="2"/>
  <text x="470" y="225" font-size="12" fill="#333">hilo inextensible (nylon)</text>

  <!-- Contrapeso cayendo -->
  <rect x="650" y="600" width="52" height="70" rx="6" fill="#c0392b" stroke="#7d2318" stroke-width="2"/>
  <text x="676" y="642" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">m</text>
  <!-- flecha de caída -->
  <line x1="730" y1="600" x2="730" y2="690" stroke="#c0392b" stroke-width="3"/>
  <polygon points="730,700 724,686 736,686" fill="#c0392b"/>
  <text x="745" y="655" font-size="14" fill="#c0392b" font-weight="bold">cae (g)</text>
  <text x="620" y="700" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Contrapeso (m ≤ 1 kg)</text>

  <!-- Flecha de avance del carro -->
  <line x1="150" y1="285" x2="60" y2="285" stroke="#1e7a46" stroke-width="4"/>
  <polygon points="52,285 68,278 68,292" fill="#1e7a46"/>
  <text x="105" y="275" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e7a46">avanza el carro</text>

  <!-- =====================================================================
                        FLUJO DE ENERGÍA
       ===================================================================== -->
  <text x="60" y="580" font-size="22" font-weight="bold" fill="#1a2b4a">Flujo de energía</text>

  <g font-size="13" fill="#1a2b4a">
    <rect x="60" y="600" width="150" height="55" rx="8" fill="#fde8e6" stroke="#c0392b" stroke-width="2"/>
    <text x="135" y="623" text-anchor="middle" font-weight="bold">Ep contrapeso</text>
    <text x="135" y="642" text-anchor="middle">m·g·h</text>

    <polygon points="215,627 238,619 238,635" fill="#7d8696"/>
    <line x1="210" y1="627" x2="232" y2="627" stroke="#7d8696" stroke-width="2"/>

    <rect x="245" y="600" width="150" height="55" rx="8" fill="#e6f2ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="320" y="623" text-anchor="middle" font-weight="bold">Torque en eje</text>
    <text x="320" y="642" text-anchor="middle">τ = T·r</text>

    <polygon points="400,627 423,619 423,635" fill="#7d8696"/>
    <line x1="395" y1="627" x2="417" y2="627" stroke="#7d8696" stroke-width="2"/>

    <rect x="430" y="600" width="165" height="55" rx="8" fill="#e8f7ee" stroke="#1e7a46" stroke-width="2"/>
    <text x="512" y="623" text-anchor="middle" font-weight="bold">Ec traslación + rotación</text>
    <text x="512" y="642" text-anchor="middle">½mv² + ½Iω²</text>

    <polygon points="600,627 623,619 623,635" fill="#7d8696"/>
    <line x1="595" y1="627" x2="617" y2="627" stroke="#7d8696" stroke-width="2"/>

    <rect x="630" y="600" width="160" height="55" rx="8" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
    <text x="710" y="623" text-anchor="middle" font-weight="bold">Pérdidas</text>
    <text x="710" y="642" text-anchor="middle">rozamiento + patinaje</text>
  </g>

  <!-- =====================================================================
                        VISTA SUPERIOR
       ===================================================================== -->
  <text x="60" y="730" font-size="22" font-weight="bold" fill="#1a2b4a">Vista superior</text>

  <!-- Chasis superior -->
  <rect x="120" y="760" width="460" height="240" rx="10" fill="#d9b382" stroke="#a9834f" stroke-width="2"/>
  <text x="350" y="790" text-anchor="middle" font-size="14" font-weight="bold" fill="#5a4326">CHASIS (vista desde arriba)</text>

  <!-- Eje trasero (con hilo) -->
  <rect x="100" y="820" width="500" height="14" rx="4" fill="#9aa4b2"/>
  <!-- enrollado del hilo -->
  <rect x="330" y="817" width="40" height="20" fill="#c0392b"/>
  <text x="350" y="865" text-anchor="middle" font-size="12" fill="#c0392b">hilo enrollado en el eje (radio r)</text>

  <!-- ruedas traseras -->
  <ellipse cx="100" cy="827" rx="16" ry="40" fill="#e8ecf2" stroke="#4a5568" stroke-width="3"/>
  <ellipse cx="600" cy="827" rx="16" ry="40" fill="#e8ecf2" stroke="#4a5568" stroke-width="3"/>
  <text x="100" y="900" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a55">ruedas motrices</text>
  <text x="600" y="900" text-anchor="middle" font-size="12" font-weight="bold" fill="#2b3a55">(fijas al eje)</text>

  <!-- Eje delantero (libre) -->
  <rect x="100" y="930" width="500" height="10" rx="4" fill="#b8c0cc"/>
  <ellipse cx="100" cy="935" rx="14" ry="36" fill="#eef1f6" stroke="#8d97a8" stroke-width="3"/>
  <ellipse cx="600" cy="935" rx="14" ry="36" fill="#eef1f6" stroke="#8d97a8" stroke-width="3"/>
  <text x="350" y="985" text-anchor="middle" font-size="12" fill="#5a6b85">eje delantero — ruedas libres (solo apoyan)</text>

  <!-- flecha dirección -->
  <line x1="350" y1="755" x2="350" y2="710" stroke="#1e7a46" stroke-width="4"/>
  <polygon points="350,702 343,718 357,718" fill="#1e7a46"/>
  <text x="400" y="725" font-size="13" font-weight="bold" fill="#1e7a46">dirección de avance</text>

  <!-- =====================================================================
                        PANEL DE PARÁMETROS
       ===================================================================== -->
  <rect x="640" y="750" width="320" height="250" rx="12" fill="#ffffff" stroke="#c7d2e0" stroke-width="2"/>
  <text x="800" y="782" text-anchor="middle" font-size="17" font-weight="bold" fill="#1a2b4a">Parámetros de diseño</text>
  <line x1="660" y1="795" x2="940" y2="795" stroke="#e2e8f0" stroke-width="2"/>
  <g font-size="14" fill="#2b3a55">
    <text x="662" y="822">R  rueda (CD)</text>        <text x="938" y="822" text-anchor="end" font-weight="bold">≈ 60 mm</text>
    <text x="662" y="850">r  eje tractor</text>        <text x="938" y="850" text-anchor="end" font-weight="bold">≈ 4 mm</text>
    <text x="662" y="878">relación R / r</text>        <text x="938" y="878" text-anchor="end" font-weight="bold">≈ 15</text>
    <text x="662" y="906">m contrapeso</text>         <text x="938" y="906" text-anchor="end" font-weight="bold">≤ 1 kg</text>
    <text x="662" y="934">h caída</text>              <text x="938" y="934" text-anchor="end" font-weight="bold">ajustable</text>
    <text x="662" y="962">dim. máx.</text>            <text x="938" y="962" text-anchor="end" font-weight="bold">40×25×40 cm</text>
    <text x="662" y="990" fill="#c0392b" font-size="12">Prohibido: motor, resorte, liga, rampa</text>
  </g>

  <!-- =====================================================================
                        LEYENDA / NOTAS CLAVE
       ===================================================================== -->
  <rect x="60" y="1030" width="880" height="190" rx="12" fill="#eef3fb" stroke="#c7d2e0" stroke-width="2"/>
  <text x="80" y="1060" font-size="17" font-weight="bold" fill="#1a2b4a">Claves físicas (para el informe)</text>
  <g font-size="14" fill="#2b3a55">
    <text x="80" y="1090">• Relación de transmisión:  (distancia carro) / (caída contrapeso) = R / r</text>
    <text x="80" y="1116">• Rodadura sin deslizamiento:  v = ω·R   y   a = α·R</text>
    <text x="80" y="1142">• Eje fino (r pequeño) → más distancia, menos fuerza (riesgo de patinaje)</text>
    <text x="80" y="1168">• El lastre sobre las ruedas motrices sube el rozamiento estático máx. → evita patinar</text>
    <text x="80" y="1194">• Existe una masa de contrapeso ÓPTIMA → candidata ideal a "pregunta detonante"</text>
  </g>
</svg>
